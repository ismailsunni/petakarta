<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PetaKarta</title>
  <script>
    // GitHub Pages SPA redirect hack
    // Converts /petakarta/p/slug → /petakarta/?slug=slug
    // The SPA then reads the query param and routes correctly
    var path = window.location.pathname;
    var base = '/petakarta/';
    var match = path.match(/\/petakarta\/p\/([^/]+)\/?$/);
    if (match) {
      window.location.replace(base + '?slug=' + match[1] + window.location.search.replace('?', '&') + window.location.hash);
    } else {
      window.location.replace(base);
    }
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
